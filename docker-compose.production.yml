services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: feedbot
    volumes:
      - feedbot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${API_ENV_FILE:-apps/api/.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://feedbot:${POSTGRES_PASSWORD}@db:5432/feedbot?schema=public
      WEB_ORIGIN: https://${DOMAIN}
      APP_URL: https://${DOMAIN}
      GOOGLE_OAUTH_REDIRECT_URI: https://${DOMAIN}/api/google/oauth/callback
      TRUST_PROXY: "true"
      BAILEYS_AUTH_DIR: /var/lib/feedbot/baileys-auth
    volumes:
      - feedbot-baileys-auth:/var/lib/feedbot/baileys-auth
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  feedbot-db-data:
  feedbot-baileys-auth:
  caddy-data:
  caddy-config:
