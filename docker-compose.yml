services:
  db:
    image: postgres:16-alpine
    container_name: feedbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedbot
      # Banco restrito ao loopback abaixo; em ambientes compartilhados/produção,
      # defina POSTGRES_PASSWORD e DATABASE_URL com um segredo próprio.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedbot}
      POSTGRES_DB: feedbot
    ports:
      # host port 5435 to avoid clashing with other local Postgres instances/containers
      - "127.0.0.1:5435:5432"
    volumes:
      - feedbot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: feedbot-api
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://feedbot:${POSTGRES_PASSWORD:-feedbot}@db:5432/feedbot?schema=public
    ports:
      - "127.0.0.1:3333:3333"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  feedbot-db-data:
